services:
  app:
    image: ${APP_IMAGE:-aws-cloud-vault:prod}
    container_name: cloud-vault-app
    env_file:
      - .env.prod
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: cloud-vault-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
