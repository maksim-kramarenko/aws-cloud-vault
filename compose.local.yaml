services:
  db:
    image: postgres:16-alpine
    container_name: cloud-vault-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
    image: aws-cloud-vault:local
    container_name: cloud-vault-app
    env_file:
      - .env
    environment:
      AWS_PROFILE: cloud-vault
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
      AWS_CONFIG_FILE: /run/secrets/aws_config
    secrets:
      - aws_credentials
      - aws_config
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: cloud-vault-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  aws_credentials:
    file: ${HOME}/.aws/credentials

  aws_config:
    file: ${HOME}/.aws/config
