name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "350475136061"
  ECR_REPOSITORY: cloud-vault
  INSTANCE_ID: i-047e9b12940bed5b1
  AWS_ROLE_ARN: arn:aws:iam::350475136061:role/cloud-vault-github-actions-role

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          docker build \
            -t "${ECR_URI}:${GITHUB_SHA}" \
            -t "${ECR_URI}:latest" \
            .

          docker push "${ECR_URI}:${GITHUB_SHA}"
          docker push "${ECR_URI}:latest"

          echo "IMAGE_URI=${ECR_URI}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy to EC2 with SSM
        run: |
          python - <<'PY'
          import json
          import os

          image = os.environ["IMAGE_URI"]
          region = os.environ["AWS_REGION"]
          account = os.environ["AWS_ACCOUNT_ID"]

          commands = [
              "set -eu",
              "cd /opt/cloud-vault",
              "sudo -u ssm-user git fetch origin main",
              "sudo -u ssm-user git reset --hard origin/main",
              f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {account}.dkr.ecr.{region}.amazonaws.com",
              f"docker pull {image}",
              f"env APP_IMAGE={image} docker compose -f compose.prod.yaml up -d",
              "docker compose -f compose.prod.yaml exec -T app flask --app 'app:create_app()' db upgrade",
              "curl -fsS http://127.0.0.1/health",
              "docker compose -f compose.prod.yaml ps"
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Cloud Vault deploy ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
